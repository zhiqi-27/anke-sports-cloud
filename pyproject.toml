[project]
name = "anke-sports-cloud"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "pymysql[rsa]>=1.1,<2",
    "pydantic-settings>=2.8,<3",
    "firebase-admin>=6.7,<8",
    "azure-functions>=1.21,<2",
    "azure-storage-queue>=12.12,<13",
    "httpx>=0.28,<1",
    "icalendar>=6.1,<7",
    "cryptography>=44",
    "defusedxml>=0.7",
    "alembic>=1.15,<2",
    "mcp==1.30.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
